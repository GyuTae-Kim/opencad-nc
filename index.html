<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- site-metadata -->
    <meta name="theme-color" content="#232830" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 홈 화면에 추가: 아이콘과 주소 막대 없는 화면. 웹 앱 매니페스트 링크는 위 site-metadata 자리에 언어별로 들어간다 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // 첫 화면이 깜빡이지 않게 테마를 먼저 정한다(기억한 선택 → 없으면 시스템 설정). 저장소가 막혀도 넘어간다.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('opencad-nc.theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <script type="module" src="./src/app/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <!-- 앱이 준비되면 이 안내를 앱 화면으로 바꾼다. -->
      <main class="site-intro">
        <h1>OpenCAD NC 뷰어</h1>
        <p>G-code·Heidenhain 평문·woodWOP MPR·WangShi PGI·XML 프로그램을 브라우저에서 열어 3D 공구 경로로 보는 무료 뷰어입니다. 파일은 서버로 보내지 않고 이 기기 안에서 읽습니다.</p>
        <noscript><p>이 뷰어는 JavaScript와 WebGL2가 필요합니다. 브라우저에서 JavaScript를 켜 주십시오.</p></noscript>
      <p><a href="https://gyutae-kim.github.io/opencad/projects/nc-viewer">OpenCAD NC 뷰어 사용법·지원 범위</a> · <a href="https://gyutae-kim.github.io/">개발자 포트폴리오</a></p>
      </main>
    </div>
  </body>
</html>
