name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:seo
      - run: npm run build
      # 휴대폰 검사(mobile-validation.yml)가 PR의 기준 커밋(= 이 main 커밋)을 다시 빌드하지 않게, 같은 명령의 이 빌드를 커밋 열쇠로 남긴다(CI 3차)
      - name: Save this build as the mobile comparison baseline
        uses: actions/cache/save@v4
        with:
          path: dist
          key: mobile-baseline-${{ github.sha }}
      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: '[🚀 release] ${{ github.event.head_commit.message }}'
