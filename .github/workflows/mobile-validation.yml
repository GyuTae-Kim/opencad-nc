name: Mobile validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
# 같은 PR에 새 커밋을 올리면 앞 실행을 멈춘다
concurrency:
  group: mobile-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 시험(npm test)은 CI 워크플로(ci.yml)가 같은 PR에서 함께 돌려 여기서는 다시 돌리지 않는다
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 휴대폰 로딩 비교에 쓰는 한글 글꼴(apt)과 lighthouse·playwright-cli(npm)는 빌드·기준 빌드와 함께 뒤에서 설치한다
      # (CI 1차 — 전에는 기준 빌드가 끝난 뒤 차례로 설치해 약 15~25초를 더 기다렸다). 비교 바로 앞 단계에서 끝을 기다리고 실패면 멈춘다
      - name: Start installing mobile audit tools in the background
        run: |
          mkdir -p "$RUNNER_TEMP/bg"
          # CI 12차: apt 미러가 잠깐 비면 글꼴 설치가 실패해 휴대폰 검사가 멈췄다(2026-11-28 STEP #256 「E: Unable to locate package fonts-noto-cjk」 —
          # 같은 러너 이미지의 앞뒤 실행은 통과). 목록 받기·설치를 세 번까지(사이 5초, apt 받기도 세 번까지) 다시 하고, 셋 다 실패해야 실패로 적는다
          nohup sh -c 'rc=1; for i in 1 2 3; do if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install --no-install-recommends -y -o Acquire::Retries=3 fonts-noto-cjk; then rc=0; break; fi; echo "fonts install attempt $i failed"; sleep 5; done; echo $rc > "$RUNNER_TEMP/bg/fonts.rc"' > "$RUNNER_TEMP/bg/fonts.log" 2>&1 &
          nohup sh -c 'npm install --prefix "$RUNNER_TEMP/mobile-audit" --no-package-lock --no-audit --no-fund lighthouse@13.5.0; echo $? > "$RUNNER_TEMP/bg/audit.rc"' > "$RUNNER_TEMP/bg/audit.log" 2>&1 &
          # CI 7차: 비교와 같은 플래그의 headless Chrome을 빈 쪽으로 한 번 띄웠다 꺼서 데운다(글꼴·도구 설치·빌드와 겹침 — 비교 첫 번 baseline-1이
          # Chrome 찬 시작(CI 6차가 찍은 값 1~22초)을 혼자 물던 것). 따로 된 프로필·60초 끊기, 실패해도 비교를 막지 않는다. 비교는 그대로 번마다 새 프로필이다
          nohup sh -c 't=$(date +%s%N); timeout 60 "$(command -v google-chrome-stable || command -v google-chrome)" --headless --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader --user-data-dir="$RUNNER_TEMP/bg/warm-profile" --dump-dom about:blank > /dev/null 2>&1; w=$?; echo "chrome warm-up exit $w in $(( ($(date +%s%N) - t) / 1000000 )) ms"; echo 0 > "$RUNNER_TEMP/bg/warm.rc"' > "$RUNNER_TEMP/bg/warm.log" 2>&1 &
      - run: npm run test:seo
      - uses: actions/upload-artifact@v4
        with:
          name: content-history
          path: site/content-history.json
      - run: npm run build
      - name: Set the candidate build aside
        run: |
          mkdir -p .runtime/performance
          mv dist .runtime/performance/candidate
          git restore site/content-history.json
      # 기준 커밋(= main 커밋)의 빌드는 배포 워크플로가 같은 명령으로 이미 만들어 그 커밋 열쇠로 남긴다(deploy.yml — CI 3차).
      # 있으면 기준 빌드(git checkout·npm run build — 10~26초)를 건너뛰고, 없으면(배포 전·배포가 멈춘 커밋) 전처럼 빌드한다
      - name: Restore the comparison baseline saved by the main deploy
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: mobile-baseline-${{ github.event.pull_request.base.sha }}
      - name: Use the restored comparison baseline
        if: steps.baseline-cache.outputs.cache-hit == 'true'
        run: mv dist .runtime/performance/baseline
      - name: Build comparison baseline in the same CI checkout
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          # 기준 커밋과 이 커밋의 의존성(package.json·package-lock.json)이 같으면 node_modules를 그대로 쓴다(CI 1차 — 전에는 npm ci 두 번)
          same_deps=0
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- package.json package-lock.json; then same_deps=1; fi
          git checkout --detach "$BASE_SHA"
          if [ "$same_deps" = 0 ]; then npm ci; fi
          # CI 15차: 기준 커밋은 main에서 이미 tsc·두 검사를 거친 판이고 견주기에는 dist만 쓴다 — vite build만(두 검사는 dist를 읽기만 해 npm run build와 같은 dist)
          npx vite build
          mv dist .runtime/performance/baseline
          git checkout --detach "$GITHUB_SHA"
          # 기준 커밋의 node_modules를 이 커밋의 것으로 되돌린다(성능 명령은 공용 사이트 도구 opencad-site-kit에 있다)
          if [ "$same_deps" = 0 ]; then npm ci; fi
      - name: Wait for mobile audit tools (Korean glyphs, lighthouse)
        timeout-minutes: 5
        run: |
          until [ -e "$RUNNER_TEMP/bg/fonts.rc" ] && [ -e "$RUNNER_TEMP/bg/audit.rc" ] && [ -e "$RUNNER_TEMP/bg/warm.rc" ]; do sleep 0.5; done
          tail -n 3 "$RUNNER_TEMP/bg/fonts.log" "$RUNNER_TEMP/bg/audit.log" "$RUNNER_TEMP/bg/warm.log"
          [ "$(cat "$RUNNER_TEMP/bg/fonts.rc")" = 0 ] && [ "$(cat "$RUNNER_TEMP/bg/audit.rc")" = 0 ]
      - name: Compare cold mobile loads
        timeout-minutes: 8
        run: |
          node_modules/.bin/opencad-site serve-performance .runtime/performance/baseline 4320 > "$RUNNER_TEMP/mobile-baseline.log" 2>&1 &
          baseline_pid=$!
          node_modules/.bin/opencad-site serve-performance .runtime/performance/candidate 4321 > "$RUNNER_TEMP/mobile-candidate.log" 2>&1 &
          candidate_pid=$!
          trap 'kill "$baseline_pid" "$candidate_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4320/ > /dev/null && curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 0.2
          done
          # CI 5차: 요약(performance-summary)·예산(check-performance-budget)이 읽는 것은 performance·accessibility·seo 분류와 FCP·LCP·TBT·CLS·JS 바이트뿐이라,
          # 쓰지 않는 best-practices 분류와 전체 페이지 스크린숏(보고서 그림)은 빼고 잰다(여섯 번마다 그만큼 덜 모음 — 재는 값·세 번 가운데 값은 그대로)
          # CI 6차: 여섯 번(기준·후보 × 세 번)을 node 한 프로세스에서 lighthouse Node API로 차례로 돌린다(.github/lighthouse-rounds.mjs).
          # 명령줄 lighthouse는 번마다 node 시작·모듈 읽기를 새로 했다(번마다 시작 간격 약 10초 가운데 lighthouse 안 시간 약 4.5초).
          # 설정·Chrome 플래그·차례·보고서 이름은 그대로이고 Chrome은 번마다 새 프로필로 띄우고 끈다(재는 조건 그대로). 번마다 걸린 시간을 찍는다
          cp .github/lighthouse-rounds.mjs "$RUNNER_TEMP/mobile-audit/"
          node "$RUNNER_TEMP/mobile-audit/lighthouse-rounds.mjs" .runtime/performance
          node_modules/.bin/opencad-site performance-summary .runtime/performance >> "$GITHUB_STEP_SUMMARY"
          # CI 17차: 휴대폰 브라우저 확인(playwright-cli — 파일 열기·올리기·화면 확인)은 아래 browser-check 작업이 따로 한다
      - name: Check mobile performance budget
        if: ${{ !cancelled() && hashFiles('.runtime/performance/comparison.json') != '' }}
        shell: bash
        run: node_modules/.bin/opencad-site check-performance-budget .runtime/performance tools/performance-budget.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-validation
          include-hidden-files: true
          path: |
            .runtime/performance/*.json
            .runtime/performance/*.html
            .runtime/performance/*.png
            .runtime/performance/*.txt

  # CI 17차: 휴대폰 브라우저 확인을 성능 견줌(lighthouse 여섯 번)과 다른 러너에서 겹쳐 돌린다 — 전에는 견줌 뒤에 차례로 약 10초(브라우저 띄우기·올리기·확인)를
  # validate-mobile 끝에 더했다(2026-11-28 #264: lighthouse 여섯 번 33초 뒤 9.6초). 같은 러너에서 겹치면 성능 측정이 흔들리므로 작업을 나눈다.
  # 후보 빌드는 vite build만(dist만 쓴다 — 두 검사는 validate-mobile이 한다), 글꼴·도구는 전처럼 뒤에서 설치한다. 확인 단계·파일은 그대로다
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start installing browser check tools in the background
        run: |
          mkdir -p "$RUNNER_TEMP/bg"
          nohup sh -c 'rc=1; for i in 1 2 3; do if sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install --no-install-recommends -y -o Acquire::Retries=3 fonts-noto-cjk; then rc=0; break; fi; echo "fonts install attempt $i failed"; sleep 5; done; echo $rc > "$RUNNER_TEMP/bg/fonts.rc"' > "$RUNNER_TEMP/bg/fonts.log" 2>&1 &
          nohup sh -c 'npm install --prefix "$RUNNER_TEMP/mobile-audit" --no-package-lock --no-audit --no-fund @playwright/cli; echo $? > "$RUNNER_TEMP/bg/audit.rc"' > "$RUNNER_TEMP/bg/audit.log" 2>&1 &
      - run: npx vite build
      - name: Wait for browser check tools (Korean glyphs, playwright-cli)
        timeout-minutes: 5
        run: |
          until [ -e "$RUNNER_TEMP/bg/fonts.rc" ] && [ -e "$RUNNER_TEMP/bg/audit.rc" ]; do sleep 0.5; done
          tail -n 3 "$RUNNER_TEMP/bg/fonts.log" "$RUNNER_TEMP/bg/audit.log"
          [ "$(cat "$RUNNER_TEMP/bg/fonts.rc")" = 0 ] && [ "$(cat "$RUNNER_TEMP/bg/audit.rc")" = 0 ]
      - name: Check the candidate build in a mobile browser
        timeout-minutes: 5
        run: |
          mkdir -p .runtime/performance
          node_modules/.bin/opencad-site serve-performance dist 4321 > "$RUNNER_TEMP/browser-candidate.log" 2>&1 &
          candidate_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 0.2
          done
          cli="$RUNNER_TEMP/mobile-audit/node_modules/.bin/playwright-cli"
          session="mobile-$GITHUB_RUN_ID"
          trap '"$cli" -s="$session" close || true; kill "$candidate_pid" 2>/dev/null || true' EXIT
          "$cli" -s="$session" open http://127.0.0.1:4321/ --config=tools/mobile-browser.json
          "$cli" -s="$session" run-code "async (page) => { await page.locator('.start .dropzone').getByRole('button', {name:'파일 열기',exact:true}).click(); }"
          "$cli" -s="$session" upload tools/mobile-part.nc
          "$cli" -s="$session" run-code "$(cat tools/mobile-browser-check.js)" | tee .runtime/performance/browser.txt
          node tools/check-browser-result.mjs .runtime/performance/browser.txt
