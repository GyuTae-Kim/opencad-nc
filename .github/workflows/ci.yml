name: CI

# main에 올라간 것은 deploy.yml이 같은 확인(형식 검사·시험·빌드)을 하고 게시한다.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 새 커밋을 올리면 앞 실행을 멈춘다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI 6차: main으로 가는 PR에서는 휴대폰 검사(mobile-validation.yml)가 같은 npm run test:seo와 npm run build(tsc --noEmit — typecheck와 같은 일 —
      # · vite build · check:seo · check:i18n)를 돌리므로 여기서는 시험만 돌린다. 다른 base의 PR과 손으로 돌린 실행에서는 전처럼 모두 돌린다
      - run: npm run typecheck
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main') }}
      - run: npm test
      - run: npm run test:seo
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main') }}
      - run: npm run build
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main') }}
