name: CI

# main에 올라간 것은 deploy.yml이 같은 확인(형식 검사·시험·빌드)을 하고 게시한다.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:seo
      - run: npm run build
