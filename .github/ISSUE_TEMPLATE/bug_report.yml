name: 버그 신고 (Bug report)
description: 파일을 잘못 읽거나 앱이 안내와 다르게 동작할 때 (A file is read wrong or the app misbehaves)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        한국어나 영어로 쓰시면 됩니다. 이슈는 누구나 볼 수 있으니 회사 도면이나 고객 파일은 올리지 마시고, 같은 문제가 나는 작은 파일이나 만든 프로그램과 판을 적어 주십시오.
        다른 웹페이지에 넣은 `<opencad-viewer>` 문제는 [opencad-site-kit](https://github.com/GyuTae-Kim/opencad-site-kit/issues)에 올려 주십시오.
        (Korean or English is fine. Issues are public, so don't attach confidential drawings. Embed problems belong in opencad-site-kit.)
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 (What happened)
      description: 기대한 것과 실제로 일어난 것 (expected vs. actual)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법 (How to reproduce)
      description: 연 파일, 누른 것, 본 화면 (the file you opened, what you clicked, what you saw)
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: 파일 (File)
      description: 형식, 만든 프로그램과 판, 내보내기 설정 (format, program and version, export settings)
      placeholder: Fanuc G코드, CAM 프로그램과 판
  - type: dropdown
    id: language
    attributes:
      label: 화면 언어 (UI language)
      options:
        - 한국어 (ko)
        - English (en)
        - 日本語 (ja)
        - 简体中文 (zh-CN)
        - Deutsch (de)
  - type: input
    id: browser
    attributes:
      label: 브라우저와 기기 (Browser and device)
      placeholder: Chrome 131 / Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 콘솔 오류 (Console errors)
      description: 브라우저 개발자 도구 콘솔에 나온 오류 (errors from the browser console)
      render: text
